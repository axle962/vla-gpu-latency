[project]
name = "vla-gpu-latency"
version = "0.1.0"
description = "Cross-GPU prediction of batch-1 VLA inference latency and CUDA-graph speedup"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.uv]
package = false
